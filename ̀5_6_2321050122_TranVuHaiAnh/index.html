<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
    width:95%;
    font-family: Arial, Helvetica, sans-serif;
    
}
header{
    background:white;
    width:100%;
    height:50px;
    display:flex;
    justify-content: space-between;
}
header-right {
    display:flex;
}
ul{
  list-style: none;
  display:flex;
  gap:20px;
  align-items: center;
  justify-content:center;
  
}
main{
    width:100%;
    height:100vh;
}
main .main-top{
    background:white;
    height:50vh;
}
.main-top p {
    color:orange;
    display:flex;
    justify-content: center;
}
.main-top h4{
    display:flex;
    justify-content:center;
}
.main-top-left img{
    width:80%;
    border-radius:10px;
    
}
.box{
    display:flex;
    justify-content:center;
    align-items: center;
}
.main-top-right .box1 p{
    color:black;
    background:white;
    width:40vh;
    height:90px;
    display:flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
     border: 1px solid grey; 

}
.main-top-right .box2 p{
     color:black;
    background:white;
    width:40vh;
    height:90px;
    display:flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    border: 1px solid grey; 
}
.boxx{
    display:flex;
    justify-content:center;
    align-items: center;
}

 .title h4 {
    display:flex;
    justify-content: center;
    align-items:center ;
    
    
}
.title-box{
    padding-bottom:60px;
}
.box-left img{
    width:90%;
}
.box-right{
    gap:40px;
}
.title-box p{
    background:white;
    width:40vh;
    height:90px;
    display:flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
     border: 1px solid grey; 
}
.title-box2{
    display:flex;
    gap:70px;
    padding-bottom: 50px;
    justify-content: center;

}
.note1{
    background:blue;
    width:10vh;
    height:50px;
    display:flex;
    justify-content: center;
    align-items: center;
    border-radius: 50px;
     border: 1px solid grey; 
     color:white;
}
.note2{
    background:white;
    width:10vh;
    height:50px;
    display:flex;
    justify-content: center;
    align-items: center;
    border-radius: 50px;
     border: 1px solid blue; 
     color:blue;;
}
    </style>
</head>
<body>
    <header>
    <div class="header-left">
        <h4> AMIS Thông tin nhân sự</h4>
    </div>
    <ul>
      <li><a href="#">Tổng quan</a></li>
  <li><a href="#">Báo giá</a></li>
  <li><a href="#">Kiến thức</a></li>
  <li><a href="#">Tính năng</a></li>
  <li><a href="#">Mua ngay</a></li>
    </ul>
    </header>
    <main>
        <div class="container">
            <div class="main-top">
                <div class="title1">
                    <p>AMIS Thông tin nhân sự</p>
                    <h4>Nhân viên gắn bó lâu dài hơn</h4>
                </div>
                <div class="box">
                <div class="main-top-left">
                    <img src="./Ảnh chụp màn hình 2025-09-19 103906.png">
                </div>
                <div class="main-top-right">
                    <div class="box1">
                    <p> Hài lòng hơn với những trải nghiệm...</p>
                    </div>
                    <div class="box2">
                        <p> Chủ động bổ sung...</p>
                    </div>
                </div>
                </div>
                </div>
                <div class="main-mid">
                    <div class="title">
                        <h4>Tự động hóa quy trình kết hợp đồng</h4>
                    </div>
                    <div class="boxx">
                        <div class="box-left">
                            <img src="./Ảnh chụp màn hình 2025-09-19 104903.png">
                        </div>
                        <div class="box-right">
                            <div class="title-box">
                                <p>Đảm bảo tính pháp lý ...</p>
                            </div>
                            <div class="title-box2">
                                <div class="note1">
                                    <p>Dùng thử</p>
                                </div>
                                <div class="note2">
                                    <p>Mua ngay</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
